name: Tests

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Set safe test environment variables
        run: |
          # These match tests/conftest.py. No real secrets or network calls are required.
          echo "SOUQSMART_CATALOG_PROVIDER=fixture" >> $GITHUB_ENV
          echo "SOUQSMART_SERVICE_KEY=test-service-key" >> $GITHUB_ENV
          echo "SOUQSMART_INTENT_PARSER=deterministic" >> $GITHUB_ENV
          echo "GEMINI_API_KEY=" >> $GITHUB_ENV

      - name: Run pytest
        run: |
          python -m pytest -q
